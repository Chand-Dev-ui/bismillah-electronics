<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Account | Bismillah Electronics</title><link rel="stylesheet" href="styles.css"><style>
.account-page{min-height:calc(100vh - 45px);display:grid;place-items:center;padding:35px 18px;background:linear-gradient(135deg,#f6f7fc,#eef2ff)}.account-card{width:min(460px,100%);background:#fff;border:1px solid #e7e9f2;border-radius:16px;padding:30px;box-shadow:0 18px 55px #202d5b12}.account-card h1{font-size:25px;margin:8px 0}.account-card>p{font-size:12px;color:#74798d;line-height:1.7}.account-card label{display:block;font-size:11px;font-weight:700;margin:15px 0}.account-card input{display:block;width:100%;padding:12px;border:1px solid #e1e5ef;border-radius:7px;margin-top:7px;font:inherit}.account-card .primary-btn{width:100%;margin-top:12px}.account-switch{display:flex;gap:8px;margin:18px 0}.account-switch button{flex:1;border:1px solid #e1e5ef;background:#fff;padding:10px;border-radius:7px;font-size:11px;cursor:pointer}.account-switch button.active{background:#f0edff;border-color:#6d43d8;color:#5d3bc0;font-weight:700}.account-message{font-size:11px;line-height:1.6;margin-top:14px;color:#48516c;overflow-wrap:anywhere}.account-links{display:flex;justify-content:space-between;margin-top:20px;gap:12px}.account-links a{font-size:10px;color:#5b50b2;text-decoration:none}.account-link-button{border:0;background:none;color:#5b50b2;text-decoration:underline;cursor:pointer;font:inherit;font-size:11px;margin-top:10px}.order-card{border:1px solid #e5e8f1;border-radius:8px;padding:10px;margin:8px 0;font-size:12px}
</style></head><body><div class="topline">BISMILLAH ELECTRONICS · CUSTOMER ACCOUNT</div><main class="account-page"><section class="account-card"><a class="brand" href="index.html"><span class="brand-mark">BE</span><span>BISMILLAH <b>ELECTRONICS</b><small>SMARTPHONE STORE</small></span></a><h1 id="heading">Customer Login</h1><p>Sign in to your customer account or create a new account.</p><div id="passwordRecovery" hidden><h2>Set a new password</h2><form id="passwordRecoveryForm"><label>New password<input id="newPassword" type="password" required minlength="6" autocomplete="new-password"></label><button class="primary-btn">Update password</button></form></div><div id="authBox"><div class="account-switch"><button id="loginTab" class="active" type="button">Login</button><button id="signupTab" type="button">Create account</button></div><form id="authForm"><label id="nameWrap" hidden>Full name<input id="fullName" autocomplete="name"></label><label>Email<input id="email" type="email" required autocomplete="email"></label><label>Password<input id="password" type="password" required minlength="6" autocomplete="current-password"></label><button class="primary-btn" id="submitBtn">Sign in</button><button type="button" id="forgotBtn" class="account-link-button">Forgot password?</button></form></div><div id="signedIn" hidden><p id="userEmail"></p><button class="primary-btn" id="signOutBtn">Sign out</button><h2>My Orders</h2><div id="myOrders">Loading orders…</div><h2>Write a verified review</h2><form id="reviewForm"><label>Delivered order<select id="reviewOrder" required></select></label><label>Product<select id="reviewProduct" required></select></label><label>Rating<select id="reviewRating"><option value="5">5 - Excellent</option><option value="4">4 - Good</option><option value="3">3 - Average</option><option value="2">2 - Poor</option><option value="1">1 - Very poor</option></select></label><label>Review<input id="reviewText" maxlength="1000" placeholder="Your experience (optional)"></label><button class="primary-btn">Submit review</button></form></div><p class="account-message" id="message" role="status"></p><div class="account-links"><a href="index.html">← Back to store</a><a href="admin.html">Admin login</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const $=id=>document.getElementById(id),cfg=window.SUPABASE_CONFIG||{};const ready=cfg.url&&cfg.anonKey&&!cfg.url.includes('PASTE_')&&!cfg.anonKey.includes('PASTE_');const sb=ready?window.supabase.createClient(cfg.url,cfg.anonKey):null;let mode='login',myOrders=[];
function message(t){$('message').textContent=t}function setMode(m){mode=m;$('loginTab').classList.toggle('active',m==='login');$('signupTab').classList.toggle('active',m==='signup');$('nameWrap').hidden=m!=='signup';$('fullName').required=m==='signup';$('heading').textContent=m==='login'?'Customer Login':'Create Customer Account';$('submitBtn').textContent=m==='login'?'Sign in':'Create account';message('')}
$('loginTab').onclick=()=>setMode('login');$('signupTab').onclick=()=>setMode('signup');
$('passwordRecoveryForm').onsubmit=async e=>{e.preventDefault();const {error}=await sb.auth.updateUser({password:$('newPassword').value});message(error?'Password update failed: '+error.message:'Password updated. You can now sign in with your new password.');if(!error){$('passwordRecovery').hidden=true;$('authBox').hidden=false;$('passwordRecoveryForm').reset()}};
sb?.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){$('passwordRecovery').hidden=false;$('authBox').hidden=true;$('signedIn').hidden=true;message('Enter your new password below.')}});
$('forgotBtn').onclick=async()=>{if(!sb){message('Supabase setup missing.');return}const email=$('email').value.trim();if(!email){message('Enter your account email first.');return}const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.href});message(error?error.message:'Password reset email requested. Check your inbox and spam folder.')};
$('authForm').onsubmit=async e=>{e.preventDefault();if(!sb){message('Supabase setup missing.');return}const email=$('email').value.trim(),password=$('password').value;message('Please wait...');if(mode==='signup'){const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:$('fullName').value.trim()}}});if(error){message(error.message);return}message(data.session?'Account created and signed in.':'Account created. Check your email to confirm, then sign in.');if(data.session)showUser(data.user)}else{const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){message(error.message);return}showUser(data.user)}};
async function cancelOrder(id){if(!confirm('Cancel this order?'))return;const {data,error}=await sb.rpc('cancel_my_order',{p_order_id:id});if(error){message('Cancellation failed: '+error.message);return}message(data?'Order cancelled.':'This order can no longer be cancelled.');await loadMyOrders()}
function showUser(user){$('authBox').hidden=true;$('signedIn').hidden=false;$('userEmail').textContent='Signed in as '+user.email;message('Your customer account is active.');loadMyOrders()}
async function loadMyOrders(){const {data,error}=await sb.from('orders').select('id,status,subtotal,delivery_fee,created_at,order_items(product_id,product_name,quantity,unit_price)').order('created_at',{ascending:false});if(error){$('myOrders').textContent='Orders could not load: '+error.message;return}myOrders=data||[];const visibleOrders=myOrders.filter(o=>o.status!=='cancelled');$('myOrders').innerHTML=visibleOrders.map(o=>`<article class="order-card"><b>Order ${o.id}</b><p>${new Date(o.created_at).toLocaleString()} · ${o.status}</p><p>${(o.order_items||[]).map(i=>`${i.product_name} × ${i.quantity}`).join(', ')}</p>${['pending','confirmed','packed'].includes(o.status)?`<button type="button" onclick="cancelOrder('${o.id}')">Cancel order</button>`:''}<b>Total: Rs. ${(Number(o.subtotal)+Number(o.delivery_fee)).toLocaleString('en-PK')}</b></article>`).join('')||'No active orders. Cancelled orders are hidden here; delivered orders remain visible.';const delivered=myOrders.filter(o=>o.status==='delivered');$('reviewOrder').innerHTML=delivered.map(o=>`<option value="${o.id}">${o.id}</option>`).join('');const products=delivered.flatMap(o=>(o.order_items||[]).map(i=>({id:i.product_id,name:i.product_name}))).filter(p=>p.id);$('reviewProduct').innerHTML=products.map(p=>`<option value="${p.id}">${p.name}</option>`).join('');$('reviewForm').hidden=!delivered.length}
$('reviewForm').onsubmit=async e=>{e.preventDefault();const {data:{user}}=await sb.auth.getUser();const {error}=await sb.from('reviews').insert({customer_id:user.id,order_id:$('reviewOrder').value,product_id:$('reviewProduct').value,rating:Number($('reviewRating').value),review_text:$('reviewText').value.trim()||null});message(error?'Review not submitted: '+error.message:'Review submitted for admin approval.');if(!error)$('reviewText').value=''};
$('signOutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};
(async()=>{if(!sb){message('Setup needed: add your Supabase Project URL and Publishable Key to config.js.');return}const {data:{session}}=await sb.auth.getSession();if(session)showUser(session.user)})();
</script></body></html>
